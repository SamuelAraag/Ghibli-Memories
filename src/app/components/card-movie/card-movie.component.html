@if (movie) {
  <article class="card-movie" [class.active]="ativo">
    <div class="poster">
      <img
        [src]="movie.image"
        [alt]="'Pôster de ' + movie.title"
        width="400"
        height="600"
        loading="lazy"
        decoding="async">

      <div class="shade"></div>

      <div class="info" [id]="'info-' + movie.id">
        @if (movie.original_title) {
          <p class="original-title" lang="ja">
            {{ movie.original_title }}
            @if (movie.original_title_romanised) {
              <span class="romanised" lang="ja-Latn">{{ movie.original_title_romanised }}</span>
            }
          </p>
        }
        <p class="meta">{{ movie.running_time }} min &bull; {{ movie.director }}</p>
        <p class="description">{{ movie.description }}</p>
      </div>

      <button
        #botao
        type="button"
        class="card-action"
        [attr.aria-expanded]="ativo"
        [attr.aria-controls]="'info-' + movie.id"
        [attr.aria-label]="'Ver detalhes de ' + movie.title"
        (click)="alternar()"
        (focus)="aoFocar(botao)"
        (blur)="desativar()">
      </button>
    </div>

    <div class="caption">
      <h3 class="title" [title]="movie.title">{{ movie.title }}</h3>
      <p class="year-score">
        <span>{{ movie.release_date }}</span>
        <span class="score" [attr.aria-label]="'Nota ' + movie.rt_score + ' de 100'">{{ movie.rt_score }}%</span>
      </p>
    </div>
  </article>
}
